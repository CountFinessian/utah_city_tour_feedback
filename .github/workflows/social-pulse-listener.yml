name: Social Pulse listener

# Hobby Vercel only allows one cron/day. This workflow drives listening against production.
on:
  schedule:
    # Discovery every 3 hours
    - cron: "0 */3 * * *"
    # Comment sync every 6 hours (offset)
    - cron: "30 */6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "discover | comments | full"
        required: false
        default: "discover"

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Choose mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode || 'discover' }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 */6 * * *" ]; then
            echo "mode=comments" >> "$GITHUB_OUTPUT"
          else
            echo "mode=discover" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger production listening cycle
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          url="https://utahcity.app/api/social-pulse/cron?mode=${MODE}"
          if [ -n "${CRON_SECRET:-}" ]; then
            code=$(curl -sS -o /tmp/listener.json -w "%{http_code}"               -X POST "$url"               -H "Authorization: Bearer ${CRON_SECRET}"               -H "Content-Type: application/json"               --max-time 60)
          else
            code=$(curl -sS -o /tmp/listener.json -w "%{http_code}"               -X POST "$url"               -H "Content-Type: application/json"               --max-time 60)
          fi
          echo "HTTP $code mode=$MODE"
          cat /tmp/listener.json || true
          test "$code" = "200"
