name: Social Pulse listener

# Hobby Vercel only allows one cron/day. This workflow drives the real
# background listening cycle every 3 hours against production.
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger production listening cycle
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          LISTENER_URL: https://utahcity.app/api/social-pulse/cron
        run: |
          set -euo pipefail
          url="$LISTENER_URL"
          if [ -n "${CRON_SECRET:-}" ]; then
            code=$(curl -sS -o /tmp/listener.json -w "%{http_code}" \
              -X POST "$url" \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -H "Content-Type: application/json" \
              --max-time 290)
          else
            code=$(curl -sS -o /tmp/listener.json -w "%{http_code}" \
              -X POST "$url" \
              -H "Content-Type: application/json" \
              --max-time 290)
          fi
          echo "HTTP $code"
          cat /tmp/listener.json || true
          test "$code" = "200"
