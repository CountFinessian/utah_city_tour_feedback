name: Social Pulse listener

# Hobby Vercel only allows one cron/day. This workflow drives listening against production.
#
# GitHub reads cron only from the default branch. A UI re-enable does not
# re-register a schedule that changed while the workflow was disabled.
# The last schedule events (2026-10-08) still ran commit 09b64b0 (`0 */3` and
# `30 */6`) and then stopped. After #15 replaced that with `17 */3` and the
# workflow was re-enabled at 2026-10-09 05:24 UTC, the 06:17 and 09:17 UTC
# runs never started. workflow_dispatch kept working. Touching this file
# re-registers the schedule. The :47 nudge covers a dropped :17 slot.
# The nudge exits before any production call when a scheduled monitor already
# succeeded in the last 2 hours, so it does not spend Treg or Gemini on a slot
# that already ran. It waits out an in-progress :17 run instead of cancelling it.
on:
  schedule:
    # Every 3 hours, off the top of the hour. UTC.
    - cron: "17 */3 * * *"
    # 90 minutes later (01:47, 04:47, … UTC) if the :17 slot is delayed or dropped.
    - cron: "47 1-23/3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "monitor | discover | comments | full"
        required: false
        default: "monitor"

# One monitor at a time. The nudge waits if :17 is still running, then skips
# when that run succeeded inside the 2 hour window.
concurrency:
  group: social-pulse-listener
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Choose mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode || 'monitor' }}" >> "$GITHUB_OUTPUT"
          else
            echo "mode=monitor" >> "$GITHUB_OUTPUT"
          fi

      # Backup slot only. A successful scheduled monitor in the last 2 hours
      # means :17 already ran, so leave before the production call.
      - name: Skip backup slot after a recent scheduled success
        id: backup
        if: github.event_name == 'schedule' && github.event.schedule == '47 1-23/3 * * *'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          now=$(date -u +%s)
          cutoff=$((now - 7200))
          skip=false
          latest=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/social-pulse-listener.yml/runs?event=schedule&status=success&per_page=5" \
            --jq '[.workflow_runs[] | select(.id != '"${GITHUB_RUN_ID}"' and .conclusion == "success")] | if length == 0 then "" else (sort_by(.updated_at) | .[-1].updated_at) end')
          if [ -n "${latest}" ]; then
            latest_s=$(date -u -d "${latest}" +%s)
            if [ "${latest_s}" -ge "${cutoff}" ]; then
              skip=true
              echo "Backup slot skipped. A scheduled monitor succeeded at ${latest}."
            fi
          fi
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"

      # One request. Discovery is capped inside the function (~38% of the window)
      # and resumes from a cursor, so due checks still run before the deadline.
      - name: Trigger production listening cycle
        if: steps.backup.outputs.skip != 'true'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          # Use www — apex utahcity.app returns 308 and curl without -L fails the job.
          url="https://www.utahcity.app/api/social-pulse/cron?mode=${MODE}"
          if [ -n "${CRON_SECRET:-}" ]; then
            code=$(curl -sS -L -o /tmp/listener.json -w "%{http_code}" \
              -X POST "$url" \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -H "Content-Type: application/json" \
              --max-time 280)
          else
            code=$(curl -sS -L -o /tmp/listener.json -w "%{http_code}" \
              -X POST "$url" \
              -H "Content-Type: application/json" \
              --max-time 280)
          fi
          echo "HTTP $code mode=$MODE"
          cat /tmp/listener.json || true
          test "$code" = "200"
