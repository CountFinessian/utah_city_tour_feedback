name: Official account connection refresh

# Renews the read-only connections to the official TikTok / YouTube / LinkedIn accounts once a day
# so nobody has to re-approve them. TikTok and YouTube refresh keys roll forward on every run.
# Needs the same CRON_SECRET repository secret the Social Pulse listener uses.
on:
  schedule:
    # Every day at 11:07 UTC
    - cron: "7 11 * * *"
  workflow_dispatch:

concurrency:
  group: owned-social-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Refresh connections in production
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          # Use www: the apex domain redirects and curl without -L would fail the job.
          code=$(curl -sS -L -o /tmp/refresh.json -w "%{http_code}" \
            -X POST "https://www.utahcity.app/api/owned-social/cron" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            --max-time 90)
          echo "HTTP $code"
          cat /tmp/refresh.json || true
          test "$code" = "200"
          # The endpoint answers 200 even when a platform refused its refresh key; fail the job so it is noticed.
          grep -q '"ok":true' /tmp/refresh.json
