name: Build & Deploy iOS to App Store

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "www/**"
      - "ios/**"
      - "capacitor.config.ts"
      - "package.json"
      - ".github/workflows/deploy-ios.yml"
  workflow_dispatch:
    inputs:
      lane:
        description: "Fastlane deployment target"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - beta

jobs:
  build-ios:
    name: Build iOS & Upload to TestFlight
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Setup Ruby for Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ios/App

      - name: Setup CI Keychain
        run: |
          KEYCHAIN_PATH="$HOME/Library/Keychains/ci_keychain.keychain-db"
          security create-keychain -p "ci_password" "$KEYCHAIN_PATH" || true
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "ci_password" "$KEYCHAIN_PATH"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

      - name: Build and Deploy to App Store
        working-directory: ios/App
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APP_IDENTIFIER: ${{ secrets.APP_IDENTIFIER }}
          CI_KEYCHAIN_PATH: /Users/runner/Library/Keychains/ci_keychain.keychain-db
          CI_KEYCHAIN_PASSWORD: ci_password
          TARGET_LANE: ${{ inputs.lane }}
        run: |
          LANE="${TARGET_LANE:-release}"
          echo "Executing Fastlane lane: $LANE"
          bundle exec fastlane $LANE

